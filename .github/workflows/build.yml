name: build-workflow-telemetry

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run all
      - name: Verify no unstage changes
        run: tests/verify-no-unstaged-changes.sh
